# AI Story RPG: CircleCI bootstrap for Python reference tests and Dart SDK.
# Flutter Android/Windows builds will be added after application sources exist.
version: 2.1

jobs:
  reference-tests:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Python version
          command: python3 --version
      - run:
          name: Generate test Ink and validate scenario
          command: |
            cd experiments/m0_engine_comparison
            python3 pilot/compile_pilot.py
      - run:
          name: Run RPG reference tests
          command: |
            cd experiments/m0_engine_comparison
            python3 -m unittest discover -s tests -v

  dart-sdk:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/project
    environment:
      DART_SDK_DIR: /home/circleci/dart-sdk
    steps:
      - checkout
      - run:
          name: Download and install official Dart stable SDK (Linux x64)
          command: |
            set -eu
            curl --fail --location --retry 3 \
              --output /tmp/dartsdk-linux-x64-release.zip \
              https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-linux-x64-release.zip
            unzip -q /tmp/dartsdk-linux-x64-release.zip -d /home/circleci
            rm /tmp/dartsdk-linux-x64-release.zip
            /home/circleci/dart-sdk/bin/dart --version
            echo 'export PATH="/home/circleci/dart-sdk/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Check Dart toolchain and source inputs
          command: |
            dart --version
            dart --help > /dev/null
            test -f experiments/m0_engine_comparison/pilot/scenario.json
            test -f experiments/m0_engine_comparison/pilot/compile_pilot.py
      - run:
          name: Run shared RPG scenario in Dart
          command: |
            cd experiments/m0_engine_comparison/dart_probe
            dart pub get
            dart analyze
            dart run bin/probe.dart ../pilot/scenario.json
            cd ../pilot
            python3 export_contract.py
            cd ../dart_probe
            dart run bin/verify_contract.dart ../pilot/scenario.json ../pilot/expected_contract.json
      - run:
          name: Test story_engine public API and snapshot support
          command: |
            cd experiments/m0_engine_comparison/story_engine_smoke
            dart pub get
            dart analyze
            dart run bin/smoke.dart
            dart run bin/full_scenario.dart ../pilot/scenario.json ../pilot/expected_contract.json
      - run:
          name: Stress test story_engine with 1000 scenes
          command: |
            cd experiments/m0_engine_comparison
            python3 pilot/generate_stress.py --count 1000 --output pilot/stress_1000.json
            cd story_engine_smoke
            dart run bin/stress.dart ../pilot/stress_1000.json
      - run:
          name: Install official Ink compiler 1.2.1
          command: |
            curl --fail --location --retry 3 -o /tmp/inklecate_linux.zip https://github.com/inkle/ink/releases/download/v1.2.1/inklecate_linux.zip
            mkdir -p /tmp/inklecate-dist
            unzip -q /tmp/inklecate_linux.zip -d /tmp/inklecate-dist
            find /tmp/inklecate-dist -type f -name 'inklecate*' -exec chmod +x {} \;
            find /tmp/inklecate-dist -type f -name 'inklecate*'
      - run:
          name: Compile pilot Ink and test ink_dart runtime
          command: |
            INK_BIN="$(find /tmp/inklecate-dist -type f -name 'inklecate*' | head -n 1)"
            test -n "$INK_BIN"
            cd experiments/m0_engine_comparison
            python3 pilot/compile_pilot.py
            "$INK_BIN" -o pilot/manor_mystery.ink.json pilot/manor_mystery.ink
            cd ink_dart_smoke
            dart pub get
            dart analyze
            dart run bin/smoke.dart ../pilot/manor_mystery.ink.json
            dart run bin/full_scenario.dart ../pilot/manor_mystery.ink.json ../pilot/scenario.json ../pilot/expected_contract.json
      - run:
          name: Record SDK version for the next M0 engine comparison
          command: |
            mkdir -p /tmp/m0-ci-artifacts
            dart --version 2>&1 | tee /tmp/m0-ci-artifacts/dart-version.txt
            printf 'Dart SDK installed on CircleCI runner only.\n' > /tmp/m0-ci-artifacts/README.txt
      - store_artifacts:
          path: /tmp/m0-ci-artifacts
          destination: m0-sdk

  flutter-reader:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Flutter stable with Dart
          command: |
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /tmp/flutter
            echo 'export PATH="/tmp/flutter/bin:$PATH"' >> "$BASH_ENV"
            /tmp/flutter/bin/flutter --version
      - run:
          name: Analyze and widget-test M1 reader
          command: |
            cd apps/story_reader
            flutter pub get
            flutter analyze
            flutter test

workflows:
  m0-bootstrap:
    jobs:
      - reference-tests
      - dart-sdk
      - flutter-reader
