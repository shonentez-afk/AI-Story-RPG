name: ai_story_reader
description: Offline-first AI Story RPG Flutter reader prototype
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  story_engine: 0.1.0-alpha.1
  campaign_manager:
    path: ../../packages/campaign_manager
  bookworld_format:
    path: ../../packages/bookworld_format
  story_core:
    path: ../../packages/story_core
  shared_preferences: ^2.5.3
  shared_preferences_platform_interface: ^2.4.2
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  xml: ^6.6.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
