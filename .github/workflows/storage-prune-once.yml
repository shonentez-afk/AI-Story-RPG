name: User-requested safe RPG storage cleanup

# No schedule or main push trigger. Only a newly changed, owner-approved
# request marker may initiate cleanup; ordinary development never does.
on:
  push:
    branches: [feature/p0-bookwide-gameplay-readiness-20261107]
    paths: ['tools/maintenance/cleanup-request.json']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Execute the exact cleanup scope recorded in cleanup-request.json'
        type: boolean
        default: false
        required: true

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: storage-prune-once-rpg
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.repository == 'shonentez-afk/AI-Story-RPG' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[repo-cleanup-20261108]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test retention rules before any deletion
        run: python3 -m unittest discover -s tools/maintenance -p 'test_*.py' -v
      - name: Apply exact owner-requested cleanup scope
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/maintenance/execute_request.py
      - name: Preserve exact deletion audit, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Story-RPG-maintenance-audit-${{ github.run_id }}
          path: artifacts/maintenance/cleanup-report.json
          retention-days: 7
          if-no-files-found: warn
