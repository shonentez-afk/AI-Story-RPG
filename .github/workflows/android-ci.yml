name: AI Story RPG CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/storage-prune-once.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-story-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-tests:
    name: Python reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pilot scenario
        run: python3 pilot/compile_pilot.py
        working-directory: experiments/m0_engine_comparison
      - name: Reference regression tests
        run: python3 -m unittest discover -s tests -v
        working-directory: experiments/m0_engine_comparison
      - name: Android host security regression
        run: python3 -m unittest discover -s tools/tests -v
      - name: Independent source-bound NPC dialogue regression
        run: python3 -m unittest discover -s tests -p 'test_rich_scene_dialogue_projection.py' -v

  dart-sdk:
    name: Dart engine and scenario tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Dart scenario contract
        run: |
          dart pub get
          dart analyze
          dart run bin/probe.dart ../pilot/scenario.json
          (cd ../pilot && python3 export_contract.py)
          dart run bin/verify_contract.dart ../pilot/scenario.json ../pilot/expected_contract.json
        working-directory: experiments/m0_engine_comparison/dart_probe
      - name: Test story_engine
        run: |
          dart pub get
          dart analyze
          dart run bin/smoke.dart
          dart run bin/full_scenario.dart ../pilot/scenario.json ../pilot/expected_contract.json
        working-directory: experiments/m0_engine_comparison/story_engine_smoke
      - name: Stress-test 1000 scenes
        run: |
          python3 pilot/generate_stress.py --count 1000 --output pilot/stress_1000.json
          (cd story_engine_smoke && dart run bin/stress.dart ../pilot/stress_1000.json)
        working-directory: experiments/m0_engine_comparison
      - name: Download Ink compiler 1.2.1
        run: |
          curl --fail --location --retry 3 -o /tmp/inklecate_linux.zip https://github.com/inkle/ink/releases/download/v1.2.1/inklecate_linux.zip
          mkdir -p /tmp/inklecate-dist
          unzip -q /tmp/inklecate_linux.zip -d /tmp/inklecate-dist
          find /tmp/inklecate-dist -type f -name 'inklecate*' -exec chmod +x {} \;
      - name: Test ink_dart
        run: |
          INK_BIN="$(find /tmp/inklecate-dist -type f -name 'inklecate*' | head -n 1)"
          test -n "$INK_BIN"
          python3 pilot/compile_pilot.py
          "$INK_BIN" -o pilot/manor_mystery.ink.json pilot/manor_mystery.ink
          cd ink_dart_smoke
          dart pub get
          dart analyze
          dart run bin/smoke.dart ../pilot/manor_mystery.ink.json
          dart run bin/full_scenario.dart ../pilot/manor_mystery.ink.json ../pilot/scenario.json ../pilot/expected_contract.json
        working-directory: experiments/m0_engine_comparison

  story-core:
    name: M1.7 deterministic world and schema contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Prepare verified native SQLite source for Linux test workspaces
        run: |
          python3 tools/ci_prepare_verified_sqlite.py --project packages/bookworld_format --project packages/campaign_manager --project packages/story_authoring
      - name: Verify reusable Dart engine dependency direction
        run: python3 tools/ci_check_engine_boundaries.py
      - name: Analyze pure Dart story_core
        working-directory: packages/story_core
        run: |
          dart pub get
          dart analyze
      - name: Test deterministic 35-turn replay and negative cases
        working-directory: packages/story_core
        run: dart test --reporter expanded
      - name: Analyze and test story_engine runtime coordinator
        working-directory: packages/story_runtime_adapter
        run: |
          dart pub get
          dart analyze
          dart test --reporter expanded
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON Schema 2020-12 and adversarial fixtures
        run: |
          python3 -m pip install --quiet jsonschema==4.23.0
          python3 -m unittest discover -s shared_schemas/tests -v
      - name: Test offline BookWorld compiler and ZIP/SQLite security
        run: python3 -m unittest discover -s tools/bookworld/tests -v
      - name: Build and verify deterministic M1.7.3 demo BookWorld
        run: |
          mkdir -p artifacts/bookworld
          python3 tools/bookworld/bookworld.py build --blueprint shared_schemas/fixtures/manor_world_m17.json --output artifacts/bookworld/manor_m17_original_demo.bworld
          python3 tools/bookworld/bookworld.py verify --input artifacts/bookworld/manor_m17_original_demo.bworld
          (cd artifacts/bookworld && sha256sum manor_m17_original_demo.bworld > SHA256SUMS.txt)
      - name: Build and verify strict PRIVATE M2d synthetic BookWorld
        run: |
          python3 -c "import json; from pathlib import Path; from tools.bookworld.private_bookworld import build; data=json.loads(Path('shared_schemas/fixtures/private_classic_sample.json').read_text(encoding='utf-8')); Path('artifacts/bookworld/book_private_sample.bworld').write_bytes(build(data['blueprint'],data['provenance'],data['source_index']))"
          python3 -m tools.bookworld.private_bookworld verify --input artifacts/bookworld/book_private_sample.bworld
          (cd artifacts/bookworld && sha256sum book_private_sample.bworld >> SHA256SUMS.txt)
      - name: Build Python-authored source-reviewed NPC rich v3
        run: |
          python3 -c "from pathlib import Path; from tools.bookworld.tests.test_rich_npc_knowledge import reviewed_sample; from tools.bookworld.private_rich_bookworld import build, verify; bp, source, index = reviewed_sample(); out = Path('artifacts/bookworld/book_private_rich_npc_python.bworld'); out.write_bytes(build(bp, source, index)); assert verify(out.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_npc_python.bworld >> SHA256SUMS.txt)
      - name: Build Python-authored NPC social witness rich-v3
        run: |
          python3 -c "from pathlib import Path; from tools.bookworld.tests.test_rich_npc_social import social_sample; from tools.bookworld.private_rich_bookworld import build, verify; bp, source, index = social_sample(); p=Path('artifacts/bookworld/book_private_rich_social_python.bworld'); p.write_bytes(build(bp, source, index)); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_social_python.bworld >> SHA256SUMS.txt)
      - name: Build Python-authored NPC item-custody rich-v3
        run: |
          python3 -c "from pathlib import Path; from tools.bookworld.tests.test_rich_npc_social import item_social_sample; from tools.bookworld.private_rich_bookworld import build, verify; bp, source, index = item_social_sample(); p=Path('artifacts/bookworld/book_private_rich_items_python.bworld'); p.write_bytes(build(bp, source, index)); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_items_python.bworld >> SHA256SUMS.txt)
      - name: Build Python-authored native book items (reviewed v4)
        run: |
          python3 -c "from pathlib import Path; from tools.bookworld.tests.test_rich_npc_social import authored_item_social_sample; from tools.bookworld.private_rich_bookworld import build, verify; bp, source, index = authored_item_social_sample(); p=Path('artifacts/bookworld/book_private_rich_items_authored_python.bworld'); p.write_bytes(build(bp, source, index)); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_items_authored_python.bworld >> SHA256SUMS.txt)
      - name: Analyze and test native Dart BookWorld reader
        working-directory: packages/bookworld_format
        run: |
          dart pub get
          dart analyze
          dart test --reporter expanded
      - name: Verify standalone book authoring without Flutter or network
        run: |
          dart pub get
          dart analyze
          dart test --reporter expanded
          dart run bin/author_book.dart verify-world ../../artifacts/bookworld/story_authoring_sourcebound_fixture.bworld
        working-directory: packages/story_authoring
      - name: Independent Python check of Dart source-locked authoring output
        run: |
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p = Path('artifacts/bookworld/story_authoring_sourcebound_fixture.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
      - name: Independent Python check of standalone reviewed-editor compiler
        run: |
          test -s artifacts/bookworld/story_authoring_review_bundle_fixture.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p = Path('artifacts/bookworld/story_authoring_review_bundle_fixture.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
      - name: Independent Python structural check of extended rich-v4 archive
        run: |
          test -s artifacts/bookworld/book_private_extended_dart.bworld
          python3 tools/ci_verify_private_extended.py artifacts/bookworld/book_private_extended_dart.bworld
      - name: Independently verify native Dart-created private BookWorld with Python
        run: |
          test -s artifacts/bookworld/book_private_sample_dart.bworld
          python3 -m tools.bookworld.private_bookworld verify --input artifacts/bookworld/book_private_sample_dart.bworld
          (cd artifacts/bookworld && sha256sum book_private_sample_dart.bworld >> SHA256SUMS.txt)
          # Verify the native v3 bytes with INDEPENDENT Python rules, not only Dart.
          test -s artifacts/bookworld/book_private_rich_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_dart.bworld >> SHA256SUMS.txt)
          # Verify the native flag-only v2 -> rich v3 upgrade cross-language.
          test -s artifacts/bookworld/book_private_rich_upgraded_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_upgraded_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_upgraded_dart.bworld >> SHA256SUMS.txt)
          # M2g3f.2b.2: verify source-locked, signed scene turns against exact
          # scene text in a fresh Dart-produced rich v3 ZIP (not a Python fixture).
          test -s artifacts/bookworld/book_private_rich_dialogue_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_dialogue_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_dialogue_dart.bworld >> SHA256SUMS.txt)
          # Causal dialogue: preserve both verified event conditions and
          # exact source quote across the independently parsed Dart ZIP.
          test -s artifacts/bookworld/book_private_rich_dialogue_causal_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_dialogue_causal_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_dialogue_causal_dart.bworld >> SHA256SUMS.txt)
          # P0 authoring: the new source-reviewed NPC conversation planner
          # emits an actual signed rich-v3 ZIP; verify exactly those Dart bytes
          # with the independent Python importer before accepting portability.
          test -s artifacts/bookworld/book_private_rich_dialogue_plan_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_dialogue_plan_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_dialogue_plan_dart.bworld >> SHA256SUMS.txt)
          # Branching spoken answers: the exact signed Dart-generated ZIP
          # must pass the INDEPENDENT Python source+consequence validator.
          test -s artifacts/bookworld/book_private_rich_npc_responses_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_npc_responses_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_npc_responses_dart.bworld >> SHA256SUMS.txt)
          # NPC v3.1 source-reviewed private extension: exact Dart ZIP
          # MUST pass the independent Python per-actor/quote/reachability gate.
          test -s artifacts/bookworld/book_private_rich_npc_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_npc_dart.bworld'); result=verify(p.read_bytes()); assert result['format_version'] == 3 and result['rich_gameplay']"
          (cd artifacts/bookworld && sha256sum book_private_rich_npc_dart.bworld >> SHA256SUMS.txt)
          # Social witness: verify the same strict Dart-produced ZIP in Python.
          test -s artifacts/bookworld/book_private_rich_social_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_social_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_social_dart.bworld >> SHA256SUMS.txt)
          test -s artifacts/bookworld/book_private_rich_items_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_items_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_items_dart.bworld >> SHA256SUMS.txt)
          test -s artifacts/bookworld/book_private_rich_items_authored_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_rich_items_authored_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_rich_items_authored_dart.bworld >> SHA256SUMS.txt)
          # Independently verify the SAME Dart bytes with Python v3 review checks.
          test -s artifacts/bookworld/book_private_reviewed_dart.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/book_private_reviewed_dart.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
          (cd artifacts/bookworld && sha256sum book_private_reviewed_dart.bworld >> SHA256SUMS.txt)
      - name: Independently verify Python-created rich NPC BookWorld in Dart
        working-directory: packages/bookworld_format
        run: |
          dart run example/verify_npc_rich.dart ../../artifacts/bookworld/book_private_rich_npc_python.bworld
          dart run example/verify_npc_rich.dart ../../artifacts/bookworld/book_private_rich_social_python.bworld
          dart run example/verify_npc_rich.dart ../../artifacts/bookworld/book_private_rich_items_python.bworld
          dart run example/verify_npc_rich.dart ../../artifacts/bookworld/book_private_rich_items_authored_python.bworld
      - name: Analyze and test transactional SQLite BookWorld campaigns
        working-directory: packages/campaign_manager
        run: |
          dart pub get
          dart analyze
          dart test --reporter expanded
      - name: Standalone RPG engine smoke without Flutter or AI
        working-directory: packages/campaign_manager
        run: dart run example/standalone_rpg.dart ../../artifacts/bookworld/manor_m17_original_demo.bworld
      - name: Upload test BookWorld artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Story-RPG-BookWorld-demo
          path: artifacts/bookworld/
          if-no-files-found: error
          retention-days: 2

  flutter-reader:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare verified native SQLite source for Flutter tests
        run: python3 tools/ci_prepare_verified_sqlite.py --project apps/story_reader
      - name: Resolve dependencies
        run: flutter pub get
        working-directory: apps/story_reader
      - name: Static analysis
        run: flutter analyze
        working-directory: apps/story_reader
      - name: Build original-demo BookWorld for Flutter UI integration tests
        run: |
          mkdir -p artifacts/bookworld
          python3 tools/bookworld/bookworld.py build --blueprint shared_schemas/fixtures/manor_world_m17.json --output artifacts/bookworld/manor_m17_original_demo.bworld
          python3 tools/bookworld/bookworld.py verify --input artifacts/bookworld/manor_m17_original_demo.bworld
      - name: Build and verify synthetic rich BookWorld for real SQLite/Flutter integration
        run: |
          # Independent native rich-v3 runtime fixture. E6d's pinned contract
          # stays enforced by its SEPARATE workflow; never silence that check.
          python3 -m tools.bookworld.ci_rich_runtime_fixture --output-dir "$RUNNER_TEMP/rich-v3-fixture"
          mkdir -p artifacts/bookworld/rich_v3
          cp "$RUNNER_TEMP/rich-v3-fixture/River_Rich_Hero_v3.bworld" artifacts/bookworld/rich_v3/River_Rich_Hero_v3.bworld
          python3 -c "from pathlib import Path; from tools.bookworld.private_rich_bookworld import verify; p=Path('artifacts/bookworld/rich_v3/River_Rich_Hero_v3.bworld'); assert verify(p.read_bytes())['format_version'] == 3"
      - name: Build real COMPLETE public-domain Grimm FB2 (62 tales)
        # Full original text is fetched only by CI and stays in the runner.
        # Never silently SKIP or replace a failed download with fake text.
        run: |
          python3 tools/build_grimm_public_domain_fb2.py \
            --output apps/story_reader/test/fixtures/grimm_ci.fb2 \
            --manifest apps/story_reader/test/fixtures/grimm_ci.json \
            --single-output apps/story_reader/test/fixtures/frog_prince_ci.fb2 \
            --single-manifest apps/story_reader/test/fixtures/frog_prince_ci.json
      - name: Upload standalone public-domain Frog-Prince benchmark
        uses: actions/upload-artifact@v4
        with:
          name: AI-Story-RPG-Grimm-Frog-Prince-FB2
          path: |
            apps/story_reader/test/fixtures/frog_prince_ci.fb2
            apps/story_reader/test/fixtures/frog_prince_ci.json
          if-no-files-found: error
          retention-days: 2
      - name: Widget tests
        env:
          AI_RPG_GRIMM_PUBLIC_FB2_PATH: test/fixtures/grimm_ci.fb2
          AI_RPG_GRIMM_PUBLIC_MANIFEST_PATH: test/fixtures/grimm_ci.json
          AI_RPG_FROG_PRINCE_FB2_PATH: test/fixtures/frog_prince_ci.fb2
          AI_RPG_FROG_PRINCE_MANIFEST_PATH: test/fixtures/frog_prince_ci.json
        timeout-minutes: 12
        # Building a SHA3-verified SQLite amalgamation adds native compile
        # time to the full widget suite. Keep a finite external watchdog
        # for genuinely blocked Futures; do not silently skip any tests.
        run: timeout --signal=TERM --kill-after=10s 660s flutter test --reporter expanded --concurrency=1 --timeout 90s
        working-directory: apps/story_reader

  android-apk:
    permissions:
      contents: write
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: [reference-tests, dart-sdk, story-core, flutter-reader]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare verified native SQLite source for Android APK
        run: python3 tools/ci_prepare_verified_sqlite.py --project apps/story_reader
      - name: Generate Android host and build APK
        run: |
          flutter create --platforms=android --project-name ai_story_reader --org com.aistoryrpg .
          python3 ../../tools/configure_android_ai_host.py android/app/src/main/AndroidManifest.xml
          python3 -m pip install --quiet Pillow
          python3 ../../tools/build_android_branding.py android/app/src/main/res
          flutter pub get
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p ../../artifacts/android
          cp build/app/outputs/flutter-apk/app-debug.apk ../../artifacts/android/AI-Story-RPG-M1-debug.apk
          cd ../../artifacts/android
          sha256sum AI-Story-RPG-M1-debug.apk > SHA256SUMS.txt
        working-directory: apps/story_reader
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Story-RPG-Android-debug
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 2
  windows-exe:
    name: Windows portable bundle (release)
    runs-on: windows-latest
    needs: [reference-tests, dart-sdk, story-core, flutter-reader]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows host and build
        shell: pwsh
        working-directory: apps/story_reader
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name ai_story_reader --org com.aistoryrpg .
          if ($LASTEXITCODE -ne 0) { throw 'flutter create failed' }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $source = 'build/windows/x64/runner/Release'
          $target = '../../artifacts/windows/AI-Story-RPG-Windows'
          if (-not (Test-Path "$source/ai_story_reader.exe")) {
            throw 'Missing Windows EXE'
          }
          if (-not (Test-Path "$source/data")) {
            throw 'Missing Flutter assets directory'
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse -Force
          $exe = Join-Path $target 'ai_story_reader.exe'
          $digest = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $target 'SHA256SUMS.txt') -Encoding utf8 -Value "$digest *ai_story_reader.exe"
      - name: Upload complete Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: AI-Story-RPG-Windows-portable
          path: artifacts/windows/AI-Story-RPG-Windows/
          if-no-files-found: error
          retention-days: 2

  publish-release:
    name: Publish Windows + Android test release
    runs-on: ubuntu-latest
    needs: [android-apk, windows-exe]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download tested Android APK
        uses: actions/download-artifact@v4
        with:
          name: AI-Story-RPG-Android-debug
          path: release/android
      - name: Download tested Windows portable bundle
        uses: actions/download-artifact@v4
        with:
          name: AI-Story-RPG-Windows-portable
          path: release/windows/AI-Story-RPG-Windows
      - name: Verify the complete bundles, make ZIP and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release/android/AI-Story-RPG-M1-debug.apk
          test -s release/windows/AI-Story-RPG-Windows/ai_story_reader.exe
          test -d release/windows/AI-Story-RPG-Windows/data
          (cd release/windows && zip -qr ../AI-Story-RPG-Windows-portable.zip AI-Story-RPG-Windows)
          cp release/android/AI-Story-RPG-M1-debug.apk release/AI-Story-RPG-Android-debug.apk
          (cd release && sha256sum AI-Story-RPG-Android-debug.apk AI-Story-RPG-Windows-portable.zip > SHA256SUMS.txt)
          cat > release/RELEASE_NOTES_RU.md <<EOF
          Тестовая сборка AI Story RPG для Windows и Android из одного проверенного коммита.
          Commit: ${GITHUB_SHA}
          CI: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Windows: скачайте AI-Story-RPG-Windows-portable.zip, распакуйте ВСЮ папку
          AI-Story-RPG-Windows и запустите ai_story_reader.exe внутри неё.
          Не переносите один exe без data и DLL.
          Android: скачайте AI-Story-RPG-Android-debug.apk, установите APK.
          SHA256SUMS.txt содержит контрольные суммы обоих файлов.

          Это тестовый релиз, не Google Play и не проверка на физических устройствах.
          EOF
      - name: Publish both installers in one GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="test-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            release/AI-Story-RPG-Android-debug.apk \
            release/AI-Story-RPG-Windows-portable.zip \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AI Story RPG test build #${GITHUB_RUN_NUMBER} (Windows + Android)" \
            --notes-file release/RELEASE_NOTES_RU.md \
            --prerelease
