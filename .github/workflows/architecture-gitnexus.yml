name: Docs GitNexus evidence verification
on:
  push:
    branches:
      - docs/unified-architecture-codegraph-20261124
    paths:
      - .github/workflows/architecture-gitnexus.yml
      - tools/architecture_map/gitnexus_audit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-gitnexus:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Immutable source worktree
        run: git worktree add --detach /tmp/ai-story-rpg-source 9e5c11eb4dc8c5fd70cd588baca4d3c12e565dbc
      - name: Install GitNexus CLI outside source
        run: |
          npm install --prefix /tmp/ai-story-gitnexus --ignore-scripts=false gitnexus
          /tmp/ai-story-gitnexus/node_modules/.bin/gitnexus --version
      - name: Run actual GitNexus without modifying source code
        run: |
          cd /tmp/ai-story-rpg-source
          export CI=1
          export GITNEXUS_NO_UPDATE_NOTIFIER=1
          /tmp/ai-story-gitnexus/node_modules/.bin/gitnexus analyze --index-only --skip-fts > /tmp/gitnexus-analysis.log 2>&1 || { tail -n 180 /tmp/gitnexus-analysis.log; exit 1; }
          tail -n 100 /tmp/gitnexus-analysis.log
      - name: Query real GitNexus index (no synthetic data)
        run: |
          cd /tmp/ai-story-rpg-source
          set +e
          /tmp/ai-story-gitnexus/node_modules/.bin/gitnexus status > /tmp/gitnexus-status.txt 2>&1
          echo "status exit=$?"
          /tmp/ai-story-gitnexus/node_modules/.bin/gitnexus cypher "MATCH (n) RETURN count(n) AS total" > /tmp/gitnexus-nodes.txt 2>&1
          echo "nodes cypher exit=$?"
          /tmp/ai-story-gitnexus/node_modules/.bin/gitnexus cypher "MATCH (a)-[r:CodeRelation]->(b) WHERE r.type = 'CALLS' RETURN count(r) AS calls" > /tmp/gitnexus-calls.txt 2>&1
          echo "calls cypher exit=$?"
          cat /tmp/gitnexus-status.txt
          cat /tmp/gitnexus-nodes.txt
          cat /tmp/gitnexus-calls.txt
          /tmp/ai-story-gitnexus/node_modules/.bin/gitnexus cypher "MATCH (a)-[r:CodeRelation]->(b) WHERE r.type = 'CALLS' AND r.confidence >= 0.7 RETURN a.name AS caller, a.filePath AS caller_file, a.startLine AS caller_line, b.name AS callee, b.filePath AS callee_file, b.startLine AS callee_line, r.confidence AS confidence LIMIT 5" -l 5 > /tmp/gitnexus-sample.txt 2>&1
          cat /tmp/gitnexus-sample.txt
      - name: Build defensible evidence report
        run: |
          python3 tools/architecture_map/gitnexus_audit.py --worktree /tmp/ai-story-rpg-source --output /tmp/gitnexus-evidence.json
          cat /tmp/gitnexus-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: gitnexus-ast-evidence
          path: |
            /tmp/gitnexus-evidence.json
            /tmp/gitnexus-status.txt
            /tmp/gitnexus-nodes.txt
            /tmp/gitnexus-calls.txt
          retention-days: 30
