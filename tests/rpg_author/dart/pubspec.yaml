name: external_rpg_author_parity
description: Read-only differential probes against the existing application libraries.
publish_to: none
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  xml: 6.6.1
  archive: 4.6.0
  crypto: 3.0.6
  campaign_manager:
    path: ../../../packages/campaign_manager
  bookworld_format:
    path: ../../../packages/bookworld_format
  story_core:
    path: ../../../packages/story_core
  story_authoring:
    path: ../../../packages/story_authoring

# CI-only parity probe: use runner's libsqlite3 instead of downloading
# sqlite3.dart's precompiled asset from GitHub releases (transient 504).
# The real native Dart/SQLite semantics remain under full test.
hooks:
  user_defines:
    sqlite3:
      source: system
